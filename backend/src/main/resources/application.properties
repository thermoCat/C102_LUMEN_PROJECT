spring.application.name=smartcane-backend

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.port=8080

# PostgreSQL (RDS) - primary DB with PostGIS
app.datasource.postgres.host=${POSTGRES_HOST:}
app.datasource.postgres.port=${POSTGRES_PORT:5432}
app.datasource.postgres.database=${POSTGRES_DB:}
app.datasource.postgres.username=${POSTGRES_USER:}
app.datasource.postgres.password=${POSTGRES_PASSWORD:}

# MySQL (RDS)
app.datasource.mysql.host=${MYSQL_HOST:}
app.datasource.mysql.port=${MYSQL_PORT:3306}
app.datasource.mysql.database=${MYSQL_DB:}
app.datasource.mysql.username=${MYSQL_USER:}
app.datasource.mysql.password=${MYSQL_PASSWORD:}

# Redis (ElastiCache)
app.redis.host=${REDIS_HOST:}
app.redis.port=${REDIS_PORT:6379}
app.redis.password=${REDIS_PASSWORD:}

# AWS / S3
app.aws.region=${AWS_REGION:ap-northeast-2}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.s3.bucket=${S3_BUCKET:}
app.s3.prefix=${S3_PREFIX:}

# Security
app.jwt.secret=${JWT_SECRET:}

# Safemap WMS API key (Ministry of the Interior)
app.safemap.api-key=${SAFEMAP_API_KEY:}

# JPA / Hibernate Spatial (PostGIS)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

# Schema auto-apply on startup
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.platform=${SPRING_SQL_INIT_PLATFORM:postgres}
spring.sql.init.schema-locations=${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:schema.sql}
