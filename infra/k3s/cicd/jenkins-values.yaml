controller:
  admin:
    username: admin

  serviceType: ClusterIP
  jenkinsUriPrefix: /jenkins
  jenkinsUrl: https://k14c102.p.ssafy.io/jenkins

  ingress:
    enabled: true
    apiVersion: networking.k8s.io/v1
    ingressClassName: traefik
    hostName: k14c102.p.ssafy.io
    path: /jenkins
    pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: jenkins-tls
        hosts:
          - k14c102.p.ssafy.io

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"

  javaOpts: >-
    -Xms512m
    -Xmx2048m

  nodeSelector:
    node.smartcane/role: app

  installPlugins: []

  initializeOnce: true
  overwritePlugins: true
  overwritePluginsFromImage: true

  JCasC:
    defaultConfig: false

  sidecars:
    configAutoReload:
      enabled: false

agent:
  enabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins
