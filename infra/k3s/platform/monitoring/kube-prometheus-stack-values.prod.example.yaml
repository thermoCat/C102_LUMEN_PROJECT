grafana:
  # Copy this file to kube-prometheus-stack-values.prod.yaml and replace with the real password.
  adminPassword: change-me-grafana-admin-password
  grafana.ini:
    server:
      root_url: https://k14c102.p.ssafy.io/grafana
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: traefik
    # Use a single host-level certificate for monitoring to avoid duplicate
    # ACME orders on the same host/path-based ingress setup.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - k14c102.p.ssafy.io
    tls:
      - secretName: monitoring-shared-tls
        hosts:
          - k14c102.p.ssafy.io
    path: /grafana
    pathType: Prefix

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - k14c102.p.ssafy.io
    paths:
      - /prometheus
  prometheusSpec:
    externalUrl: https://k14c102.p.ssafy.io/prometheus
    routePrefix: /prometheus
    retention: 10d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - k14c102.p.ssafy.io
    paths:
      - /alertmanager
  alertmanagerSpec:
    externalUrl: https://k14c102.p.ssafy.io/alertmanager
    routePrefix: /alertmanager

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
